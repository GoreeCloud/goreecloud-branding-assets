<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GoreeCloud Mesh Interlace presentation artwork</title>
  <desc id="desc">Approved presentation artwork for the GoreeCloud Mesh Interlace identity.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1120" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset=".52" stop-color="#111A3D"/>
      <stop offset="1" stop-color="#251047"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(338 296) rotate(12) scale(340)">
      <stop stop-color="#38BDF8" stop-opacity=".28"/>
      <stop offset=".56" stop-color="#6366F1" stop-opacity=".13"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meshA" x1="32" y1="132" x2="440" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="meshB" x1="42" y1="18" x2="390" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset=".52" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="meshC" x1="410" y1="14" x2="82" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A78BFA"/>
