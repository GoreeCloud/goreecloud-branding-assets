  <text x="646" y="314" fill="#C7D2FE" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="520">Coordination made tangible.</text>
  <text x="646" y="370" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="21">Interlace identity • Glaze UI</text>
