    <path d="M-190 0 C-122 -110 -35 -120 0 -78 C35 -36 122 -28 190 -86" stroke="#062A3F" stroke-width="74" opacity=".28"/>
    <path d="M-190 0 C-122 -110 -35 -120 0 -78 C35 -36 122 -28 190 -86" stroke="url(#meshA)" stroke-width="54"/>
    <g transform="rotate(120)">
